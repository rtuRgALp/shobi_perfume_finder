name: Publish catalog snapshot
on:
  workflow_dispatch:
    inputs:
      refresh:
        description: Explicitly collect new source data before publishing (normally leave off)
        type: boolean
        default: false
  push:
    branches: [main]
concurrency:
  group: shobi-release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -r pipeline/requirements.txt
      - uses: actions/cache@v4
        with:
          path: data/raw/http
          key: shobi-http-${{ runner.os }}-${{ github.run_id }}
          restore-keys: shobi-http-${{ runner.os }}-
      - name: Collect and hydrate incrementally
        if: github.event_name == 'workflow_dispatch' && inputs.refresh
        run: python -m pipeline.cli refresh --limit 200
      - name: Validate release
        run: |
          python -m unittest discover -s pipeline/tests -v
          python -m pipeline.cli build
          pnpm test
          pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Preserve validated catalog changes
        if: github.event_name == 'workflow_dispatch' && inputs.refresh
        run: |
          git add data/catalog public/data public/assets
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Refresh validated fragrance catalog'
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data-refresh-report
          path: data/reports/
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Check deployed entry point
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --retry 5 --retry-delay 5 "$SITE_URL"
          curl --fail --retry 5 --retry-delay 5 "${SITE_URL}data/current.json" -o /tmp/shobi-live-manifest.json
          python -c 'import json; m=json.load(open("/tmp/shobi-live-manifest.json")); assert m["schemaVersion"] == 1 and m["count"] >= 2253'
